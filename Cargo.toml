[package]
name = "SigmaOS-zipkin"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SigmaOS component - part of multi-repository architecture"

[lib]
name = "zipkin"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
log = "0.4"
toml = "0.8"
serde_json = "1"
